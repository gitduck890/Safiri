<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safiri - Fast & Easy Self-Service Booking</title>
    <style>
      :root {
        --primary: #0f766e;
        --primary-dark: #115e59;
        --accent: #f59e0b;
        --bg-light: #f8fafc;
        --text-main: #334155;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background-color: var(--bg-light);
        color: var(--text-main);
        line-height: 1.6;
      }

      /* Navigation */
      header {
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        padding: 1rem 5%;
      }
      .logo {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--primary);
        text-decoration: none;
      }
      .nav-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }
      .nav-right a {
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        color: var(--text-main);
      }
      .nav-right a:hover {
        color: var(--primary);
      }

      /* Hero */
        .hero {
         background:
        linear-gradient(rgba(15, 118, 110, 0.6), rgba(17, 94, 89, 0.72)),
         url("hero.jpg") center 55% / cover no-repeat;
            center/cover;
        color: white;
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 5rem 5%;
        text-align: center;
      }
      .hero h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }
      .hero p {
        max-width: 600px;
        font-size: 0.95rem;
      }

      /* Search section */
      .search-section {
        padding: 4rem 5%;
        background: var(--bg-light);
      }
      .search-card {
        background: white;
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem;
        border-radius: var(--radius);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      .search-card h2 {
        font-size: 1.5rem;
        margin-bottom: 1.25rem;
        color: var(--primary);
      }
      .search-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
      }
      .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.3rem;
      }
      .form-group input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 0.95rem;
      }
      .form-group input:focus {
        outline: 2px solid var(--primary);
        border-color: transparent;
      }
      .btn-search {
        background: var(--accent);
        color: white;
        border: none;
        font-weight: 700;
        font-size: 1rem;
        border-radius: 8px;
        cursor: pointer;
        padding: 0.8rem 2rem;
        margin-top: 1.5rem;
        width: 100%;
        transition: background 0.2s;
      }
      .btn-search:hover {
        background: #d97706;
      }

      /* Routes section */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 3rem 5% 4rem;
      }
      .section-title {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .section-sub {
        text-align: center;
        color: #64748b;
        margin-bottom: 2rem;
      }
      .route-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.5rem;
      }
      .route-card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: var(--radius);
        padding: 1.25rem 1.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition:
          transform 0.15s,
          border-color 0.15s;
      }
      .route-card:hover {
        transform: translateY(-3px);
        border-color: var(--primary);
      }
      .route-card h3 {
        font-size: 1.1rem;
        color: var(--text-main);
      }
      .route-card .meta {
        font-size: 0.85rem;
        color: #64748b;
        margin: 0.25rem 0 0.75rem;
      }
      .route-card .price {
        font-weight: 700;
        color: var(--primary);
      }

      /* Find your ride */
      .combo { position: relative; }
      .combo input { cursor: pointer; }
      .combo-list {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        margin-top: 4px;
        background: white;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        max-height: 240px;
        overflow-y: auto;
        list-style: none;
        z-index: 20;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      }
      .combo-list.open { display: block; }
      .combo-list li { padding: 0.7rem 0.9rem; cursor: pointer; }
      .combo-list li:hover,
      .combo-list li.active { background: #f0fdfa; color: var(--primary); }
      .combo-list li.empty { color: #94a3b8; cursor: default; }
      .routes-card { margin-top: 1.5rem; animation: pop 0.25s ease-out; }
      .routes-card[hidden] { display: none; }
      .routes-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0.75rem;
      }
      .route-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        padding: 0.9rem 1.1rem;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        text-decoration: none;
        color: var(--text-main);
        transition: border-color 0.15s, transform 0.15s;
      }
      .route-item:hover { border-color: var(--primary); transform: translateY(-2px); }
      .route-item strong { display: block; }
      .route-item small { color: #64748b; }
      .route-item .price { font-weight: 700; color: var(--primary); white-space: nowrap; }
      @keyframes pop {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }

      /* Print ticket (paste M-Pesa message) */
      .pt-bg { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 300; overflow-y: auto; }
      .pt-bg[hidden] { display: none; }
      .pt-modal { background: #fff; border-radius: 12px; width: 100%; max-width: 440px; padding: 1.75rem 1.5rem; box-shadow: 0 20px 50px rgba(0,0,0,.25); margin: auto; }
      .pt-modal h2 { font-size: 1.3rem; color: #0f766e; margin-bottom: 0.75rem; }
      .pt-modal label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
      .pt-modal textarea { width: 100%; min-height: 120px; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; font-family: inherit; resize: vertical; }
      .pt-modal textarea:focus { outline: 2px solid #0f766e; border-color: transparent; }
      .pt-hint { font-size: 0.78rem; color: #64748b; margin-top: 0.35rem; }
      .pt-err { font-size: 0.8rem; color: #b91c1c; margin-top: 0.35rem; min-height: 1.1em; }
      .pt-btn { display: block; width: 100%; background: #0f766e; color: #fff; border: none; padding: 0.8rem; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 0.9rem; }
      .pt-btn:hover { background: #115e59; }
      .pt-btn:disabled { background: #94a3b8; cursor: not-allowed; }
      .pt-btn.alt { background: #fff; color: #0f766e; border: 2px solid #0f766e; margin-top: 0.5rem; }
      .pt-btn.alt:hover { background: #f0fdfa; }
      .pt-link { background: none; border: none; color: #64748b; font-weight: 600; width: 100%; padding: 0.7rem; cursor: pointer; margin-top: 0.25rem; font-size: 0.95rem; }
      .pt-img { width: 100%; border-radius: 10px; border: 1px solid #e2e8f0; margin: 0.5rem 0; }
      .pt-center { text-align: center; }
      .pt-center p { color: #64748b; font-size: 0.92rem; margin-top: 0.4rem; }
      .pt-icon { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 1.8rem; font-weight: 800; margin: 0.25rem auto 1rem; background: #dcfce7; color: #15803d; }

      @media (max-width: 600px) {
        .nav-right {
          gap: 0.75rem;
        }
        .hero h1 {
          font-size: 1.9rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">Safiri</a>
      <div class="nav-right">
        <a href="#" onclick="openPrintTicket(event)">Print Ticket</a>
      </div>
    </header>

    <section class="hero">
      <h1>Good Journeys Start Here</h1>
      <p>Book online with Safiri and get an SMS ticket after payment.</p>
    </section>

    <section class="search-section" id="search">
      <div class="search-card">
        <h2>Find your ride</h2>
        <div class="form-group combo">
          <label for="bookFrom">Book from</label>
          <input
            type="text"
            id="bookFrom"
            placeholder="Select or search a town"
            autocomplete="off"
          />
          <ul class="combo-list" id="bookFromList"></ul>
        </div>
      </div>
      <div class="search-card routes-card" id="routesCard" hidden>
        <h2 id="routesTitle">Available routes</h2>
        <div class="routes-list" id="routesList"></div>
      </div>
    </section>

    <div class="pt-bg" id="ptModal" hidden>
      <div class="pt-modal" id="ptBody" role="dialog" aria-modal="true"></div>
    </div>

    <script>
      // Fares from Nairobi. Edit this list to change the available options.
      const PRICES = {
        Voi: 1200, Mombasa: 1500, Mtwapa: 1600, Mavueni: 1700,
        Kilifi: 1700, Malindi: 1800, Ukunda: 1600,
      };
      const ORIGINS = ["Nairobi", ...Object.keys(PRICES)];

      function routesFrom(origin) {
        if (origin === "Nairobi") return Object.entries(PRICES);
        return [["Nairobi", PRICES[origin]]];
      }

      const fromInput = document.getElementById("bookFrom");
      const fromList = document.getElementById("bookFromList");
      const routesCard = document.getElementById("routesCard");

      function renderOptions(filter) {
        const q = (filter || "").trim().toLowerCase();
        const matches = ORIGINS.filter((o) => o.toLowerCase().includes(q));
        fromList.innerHTML = matches.length
          ? matches.map((o) => `<li data-city="${o}">${o}</li>`).join("")
          : '<li class="empty">No matching towns</li>';
        const first = fromList.querySelector("li[data-city]");
        if (first && q) first.classList.add("active");
      }

      function openList() { renderOptions(""); fromList.classList.add("open"); }
      function closeList() { fromList.classList.remove("open"); }

      function selectOrigin(city) {
        fromInput.value = city;
        closeList();
        try { localStorage.setItem("safiri_city", city); } catch (e) {}
        document.getElementById("routesTitle").textContent = "Available routes from " + city;
        document.getElementById("routesList").innerHTML = routesFrom(city)
          .map(([dest, price]) => {
            const href = "inventory.html?from=" + encodeURIComponent(city) + "&to=" + encodeURIComponent(dest);
            return `<a class="route-item" href="${href}">
              <span><strong>${city} → ${dest}</strong><small>Daily departures</small></span>
              <span class="price">KSh ${price.toLocaleString("en-KE")}</span>
            </a>`;
          })
          .join("");
        routesCard.hidden = false;
        routesCard.style.animation = "none";
        void routesCard.offsetWidth;
        routesCard.style.animation = "";
      }

      fromInput.addEventListener("focus", () => { fromInput.select(); openList(); });
      fromInput.addEventListener("input", () => { renderOptions(fromInput.value); fromList.classList.add("open"); });
      fromInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          const li = fromList.querySelector("li[data-city]");
          if (li) selectOrigin(li.dataset.city);
        } else if (e.key === "Escape") closeList();
      });
      fromList.addEventListener("mousedown", (e) => {
        const li = e.target.closest("li[data-city]");
        if (li) { e.preventDefault(); selectOrigin(li.dataset.city); }
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".combo")) closeList();
      });

      // Point this at your backend, e.g. "https://yourdomain.com/api".
      // Leave empty to use built-in demo data.
      const API_BASE = "";

      /* ===================== PRINT TICKET (paste M-Pesa message) ===================== */
      /* Expected API:
         POST {API_BASE}/tickets/verify
           body: { reference: "QWE1ABC2DE", message: "<pasted SMS>" }
           -> { status: "paid", ticket: { reference, from, to, departure_time (ISO),
                                          plate, seats, amount, phone } }
            | { status: "pending", message? }     (payment found but not confirmed yet)
            | { status: "not_found", message? }   (code doesn't match any booking)
         Your server must check the code against real M-Pesa/booking records. */
      (function () {
        const api = () => (typeof API_BASE === "undefined" ? "" : API_BASE);
        const money = (n) => "KSh " + Number(n).toLocaleString("en-KE");
        const pretty = (p) => {
          p = String(p || "");
          if (/^254[71]\d{8}$/.test(p)) { const l = "0" + p.slice(3); return `${l.slice(0, 4)} ${l.slice(4, 7)} ${l.slice(7)}`; }
          return p || "—";
        };
        const el = (id) => document.getElementById(id);
        const modal = () => el("ptModal");
        const body = (html) => { el("ptBody").innerHTML = html; };

        /* ---- Ticket image (canvas, no libraries). t = ticket details ---- */
        window.drawTicketImage = function (t) {
          const W = 900, H = 1060;
          const c = document.createElement("canvas");
          c.width = W; c.height = H;
          const g = c.getContext("2d");
          const font = (w, px, mono) => `${w} ${px}px ${mono ? "ui-monospace, Menlo, Consolas, monospace" : 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'}`;
          const d = new Date(t.departure_time);

          g.fillStyle = "#e2e8f0"; g.fillRect(0, 0, W, H);
          g.fillStyle = "#ffffff"; g.fillRect(40, 40, W - 80, H - 80);
          g.fillStyle = "#0f766e"; g.fillRect(40, 40, W - 80, 190);
          g.fillStyle = "#ffffff"; g.textAlign = "left"; g.textBaseline = "alphabetic";
          g.font = font(800, 64); g.fillText("Safiri", 80, 135);
          g.font = font(600, 26); g.fillText("E-TICKET", 80, 185);
          g.textAlign = "right"; g.fillStyle = "#fcd34d"; g.font = font(800, 34);
          g.fillText("PAID ✓", W - 80, 135); g.textAlign = "left";

          g.fillStyle = "#334155";
          let size = 58;
          const route = `${t.from} → ${t.to}`;
          g.font = font(800, size);
          while (g.measureText(route).width > W - 160 && size > 28) { size -= 2; g.font = font(800, size); }
          g.fillText(route, 80, 330);

          const field = (label, value, x, y, mono) => {
            g.fillStyle = "#94a3b8"; g.font = font(700, 20); g.fillText(label, x, y);
            g.fillStyle = "#1e293b"; g.font = font(700, 34, mono); g.fillText(value, x, y + 46);
          };
          const date = d.toLocaleDateString("en-KE", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
          const seats = Number(t.seats) || 1;
          field("DATE", date, 80, 430);
          field("VEHICLE", t.plate || "—", 500, 430);
          field("SEATS", `${seats} seat${seats === 1 ? "" : "s"}`, 80, 560);
          field("AMOUNT PAID", money(t.amount), 500, 560);
          field("PHONE", pretty(t.phone), 80, 690);
          field("M-PESA REFERENCE", t.reference || "—", 500, 690, true);

          const y = 820;
          g.fillStyle = "#e2e8f0";
          g.beginPath(); g.arc(40, y, 24, 0, Math.PI * 2); g.fill();
          g.beginPath(); g.arc(W - 40, y, 24, 0, Math.PI * 2); g.fill();
          g.strokeStyle = "#cbd5e1"; g.lineWidth = 3; g.setLineDash([12, 10]);
          g.beginPath(); g.moveTo(80, y); g.lineTo(W - 80, y); g.stroke(); g.setLineDash([]);

          g.fillStyle = "#334155"; g.font = font(700, 26);
          g.fillText("Show this ticket when boarding.", 80, 890);
          g.fillStyle = "#64748b"; g.font = font(500, 22);
          g.fillText("Keep this image as your proof of booking.", 80, 928);
          g.fillText("Issued " + new Date().toLocaleString("en-KE", { dateStyle: "medium", timeStyle: "short" }), 80, 960);
          if (t.demo) { g.textAlign = "right"; g.fillStyle = "#b91c1c"; g.font = font(800, 24); g.fillText("DEMO TICKET", W - 80, 960); g.textAlign = "left"; }
          return c.toDataURL("image/png");
        };

        // M-Pesa codes are 10 characters, letters + digits (e.g. QWE1ABC2DE)
        function parse(text) {
          const up = String(text).toUpperCase();
          const codes = (up.match(/\b[A-Z0-9]{10}\b/g) || []).filter((c) => /[A-Z]/.test(c) && /\d/.test(c));
          const amt = String(text).match(/ksh\.?\s?([\d,]+(?:\.\d+)?)/i);
          return { reference: codes[0] || "", amount: amt ? Number(amt[1].replace(/,/g, "")) : null };
        }

        function close() { modal().hidden = true; }

        function showPaste(prefill, error) {
          body(`
            <h2>Print your ticket</h2>
            <label for="ptMsg">Paste your M-Pesa confirmation message</label>
            <textarea id="ptMsg" placeholder="QWE1ABC2DE Confirmed. Ksh1,500.00 paid to …"></textarea>
            <div class="pt-hint">Copy the full SMS you received from M-Pesa when you paid. We'll check it before printing your ticket.</div>
            <div class="pt-err" id="ptErr"></div>
            <button class="pt-btn" id="ptGo">Verify &amp; get ticket</button>
            <button class="pt-link" id="ptCancel" type="button">Cancel</button>`);
          el("ptMsg").value = prefill || "";
          el("ptErr").textContent = error || "";
          el("ptCancel").onclick = close;
          el("ptGo").onclick = () => verify(el("ptMsg").value);
          el("ptMsg").focus();
        }

        async function verify(msg) {
          const { reference, amount } = parse(msg);
          if (!reference) return showPaste(msg, "We couldn't find an M-Pesa code (like QWE1ABC2DE) in that message. Please paste the whole message.");
          const btn = el("ptGo");
          btn.disabled = true; btn.textContent = "Checking…";
          try {
            let r;
            if (api()) {
              const res = await fetch(`${api()}/tickets/verify`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ reference, message: msg }),
              });
              if (!res.ok) throw new Error(res.status);
              r = await res.json();
            } else {
              // Demo mode: accept any valid-looking code and show a sample ticket.
              const dep = new Date(); dep.setHours(7, 0, 0, 0);
              r = { status: "paid", ticket: { reference, from: "Nairobi", to: "Mombasa", departure_time: dep.toISOString(), plate: "KDA 214X", seats: 1, amount: amount || 1500, phone: "", demo: true } };
            }
            if (r.status === "paid" && r.ticket) return showTicket(r.ticket);
            if (r.status === "pending") {
              body(`
                <div class="pt-center">
                  <div class="pt-icon">…</div>
                  <h2>We're still verifying</h2>
                  <p>${r.message || "We found your payment but it isn't confirmed yet. Please try again in a few minutes."}</p>
                </div>
                <button class="pt-btn" id="ptClose">Close</button>`);
              el("ptClose").onclick = close;
              return;
            }
            showPaste(msg, r.message || "We couldn't match that message to a paid booking. Check the message and try again.");
          } catch (e) {
            showPaste(msg, "We couldn't reach the server to verify. Please try again.");
          }
        }

        function showTicket(t) {
          const img = window.drawTicketImage(t);
          const file = `safiri-ticket-${String(t.reference || "booking").replace(/[^A-Za-z0-9]/g, "")}.png`;
          body(`
            <div class="pt-center">
              <div class="pt-icon">✓</div>
              <h2 style="margin-bottom:0">Payment verified</h2>
            </div>
            <img class="pt-img" src="${img}" alt="Your Safiri ticket" />
            <button class="pt-btn" id="ptSave" type="button">Save ticket</button>
            <button class="pt-link" id="ptDone" type="button">Done</button>`);
          el("ptSave").onclick = () => {
            const a = document.createElement("a");
            a.href = img; a.download = file;
            document.body.appendChild(a); a.click(); a.remove();
            el("ptSave").textContent = "Ticket saved ✓";
          };
          el("ptDone").onclick = close;
        }

        window.openPrintTicket = function (e) {
          if (e) e.preventDefault();
          modal().hidden = false;
          showPaste("");
        };
        document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal().hidden) close(); });
      })();
    </script>
  </body>
</html>
